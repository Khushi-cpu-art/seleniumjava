name: Selenium Debug

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧩 Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 🔍 Debug Chrome Install
        run: |
          echo "Chrome Path:"
          which google-chrome
          echo "Chrome Version:"
          google-chrome --version

      - name: 🛠 Maven Build
        run: mvn clean install -DskipTests

      # 👇 MOST IMPORTANT: run tests in DEBUG MODE
      - name: 🧪 Run Selenium Tests (debug mode)
        run: |
          echo "======= RUNNING TESTS ======="
          mvn -X -e test || true
          echo "======= TESTS FINISHED ======="

      # 👇 SEE CONTENT OF PROJECT
      - name: 📁 Debug target folder
        if: always()
        run: |
          echo "====== Project Structure ======"
          ls -R .

          echo "====== Does extent-report exist? ======"
          ls -R target/extent-report || echo "❌ NO REPORT FOLDER FOUND"

      - name: 📤 Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-report/
