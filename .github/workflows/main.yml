name: Run Selenium Tests with Extent Report

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧩 Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 🧩 Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxss1 fonts-liberation libappindicator3-1

      - name: 📦 Build Project (skip tests)
        run: mvn clean install -DskipTests

      - name: 🧪 Run Selenium Tests
        run: mvn test

      - name: 📁 Debug extent-report folder
        if: always()
        run: ls -R target/extent-report || echo "No extent-report folder"

      - name: 📤 Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: |
            target/extent-report/ExtentReport.html
            target/extent-report/screenshots/
