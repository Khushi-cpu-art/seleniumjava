name: Run Selenium Tests with Extent Report

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧩 Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 🔍 Verify Chrome Installation
        run: |
          which google-chrome
          google-chrome --version || echo "Chrome NOT found"

      - name: 🛠 Maven Build
        run: mvn clean install -DskipTests

      - name: 🧪 Run Selenium Tests
        run: mvn -X test

      - name: 📁 Debug extent-report folder
        if: always()
        run: |
          echo "===== Root Project Structure ====="
          ls -R .
          echo "===== Checking target/extent-report ====="
          ls -R target/extent-report || echo "❌ Extent report NOT GENERATED!"

      - name: 📤 Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: |
            target/extent-report/ExtentReport.html
            target/extent-report/screenshots/
