name: Run Selenium Tests with Extent Report

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # 1. Checkout repository
      # ------------------------------
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      # ------------------------------
      # 2. Setup Java 17
      # ------------------------------
      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------
      # 3. Install Google Chrome
      # ------------------------------
      - name: 🧩 Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 🔍 Show Chrome version
        run: google-chrome --version

      # ------------------------------
      # 4. Build Project
      # ------------------------------
      - name: 📦 Build Project (skip tests)
        run: mvn clean install -DskipTests

      # ------------------------------
      # 5. Run Selenium TestNG Tests
      # ------------------------------
      - name: 🧪 Run Selenium Tests (generates Extent Report)
        run: mvn test

      # ------------------------------
      # 6. Debug - List output files
      # ------------------------------
      - name: 📁 List all files
        if: always()
        run: ls -R .

      # ------------------------------
      # 7. Upload Extent Report + Screenshots
      # ------------------------------
      - name: 📤 Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: |
            **/extent-report/ExtentReport.html
            **/extent-report/screenshots/
