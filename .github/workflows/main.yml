name: Run Selenium Tests with Extent Report

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxss1 libappindicator3-1 fonts-liberation

      - name: 🟢 Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 🟢 Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Download Maven dependencies
        run: mvn dependency:resolve

      - name: 🧪 Compile test.java with dependencies
        run: |
          cp=$(mvn dependency:build-classpath -Dmdep.outputFile=cp.txt && cat cp.txt)
          mkdir -p target/classes
          javac -cp "target/classes:$cp" test.java -d target/classes

      - name: 🏃 Run test.java with TestNG
        run: |
          cp=$(mvn dependency:build-classpath -Dmdep.outputFile=cp.txt && cat cp.txt)
          java -cp "target/classes:$cp" org.testng.TestNG testng.xml

      - name: 📤 Upload Extent Report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: |
            target/extent-report/ExtentReport.html
            target/extent-report/screenshots/
